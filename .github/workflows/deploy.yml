name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Rebuild daily so new agenda entries from the Google Sheet (baked in at
    # build time) show up even without a code change.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git for gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # gh-pages clones the repo into a fresh temp dir to push, which
          # doesn't inherit the credentials actions/checkout sets up on the
          # original checkout. Rewrite github.com URLs globally so that
          # clone picks up a token too.
          git config --global "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf" "https://github.com/"

      - name: Build and deploy
        run: npm run deploy
